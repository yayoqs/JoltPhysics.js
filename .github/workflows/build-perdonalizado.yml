name: Build JoltPhysics.js Custom

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:latest
    steps:
      - name: Checkout código con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar CMake
        run: |
          mkdir -p Build/Debug/ST
          cd Build/Debug/ST
          emcmake cmake /__w/JoltPhysics.js/JoltPhysics.js -DCMAKE_BUILD_TYPE=Debug

      - name: Generar bindings (glue.cpp)
        run: |
          cd Build/Debug/ST
          make jolt-bindings -j$(nproc)

      - name: Copiar glue.cpp para diagnóstico
        run: |
          find . -name "glue.cpp" -exec cp {} dist/ \;
          ls -la dist/glue.cpp || echo "glue.cpp no encontrado en ningún lugar"

      - name: Continuar compilación
        run: |
          cd Build/Debug/ST
          make -j$(nproc)

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: jolt-physics-custom
          path: |
            dist/jolt-physics.wasm-compat.js
            dist/jolt-physics.wasm-compat.wasm
            dist/glue.cpp